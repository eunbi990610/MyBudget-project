<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>daily</title>

</head>
<style>

body{
    display: flex;
    justify-content: space-around;
}

    .list-title{
        margin-bottom: 8px;
    }
    .lists{
        padding: 3px 5px;
        border-radius: 20px;
        border: 1px solid black;
        margin : 0 3px;

    }

    .choice{
        background-color: cornflowerblue;
        color: white;
    }


</style>
<link rel="stylesheet" href="/css/calendar.css">
<script defer src="/js/Transaction.js"></script>
<script defer src="/js/Calendar.js"></script>
<body>

<!--달력-->
<div class="calendar">
     <div class="calendar-header">
         <button type="button" id="nav-before">&lt;</button>
         <div class="calendar-title">
             <span class="year" th:text="${year}"></span>년
             <span class="month" th:text="${month}"></span>월
         </div>
         <button type="button" id="nav-after">&gt;</button>
     </div>

    <div class="calendar-body">
        <div class="days">
            <div class="day sun">일</div>
            <div class="day">월</div>
            <div class="day">화</div>
            <div class="day">수</div>
            <div class="day">목</div>
            <div class="day">금</div>
            <div class="day sat">토</div>
        </div>
        <div class="dates"></div>

    </div>
</div>



<!--거래 내역-->
<div class="transaction-list">
    <div class="list-header">
        <span>내용</span>
        <span>금액</span>
        <span>카테고리</span>
        <span>지출 수단</span>
        <span>메모</span>
    </div>
    <div class="list-content">
<!--        <div class="list-body">-->
<!--            <span>${list.transactionTitle}</span>-->
<!--            <span>${list.transactionAmount}</span>-->
<!--            <span>${list.categoryId}</span>-->
<!--            <span>${list.transactionType}</span>-->
<!--            <span>${list.memo}</span>-->
<!--        </div>-->
    </div>
</div>


<!--거래 등록-->
<div class="transaction-section" style="display: none">
    <h1>거래 등록</h1>
    <form th:action="@{/transactions/add}" method="post">
        <div><span>거래 일자</span><input type="date" name="transactionDate"></div>
        <div><span>거래 금액</span><input type="text" name="transactionAmount"></div>
        <div><span>거래 내용</span><input type="text" name="transactionTitle"></div>

        <div>
            <span>수익/지출</span>
            <input type="radio" name="transactionType" value="INCOME">수익
            <input type="radio" name="transactionType" value="EXPENSE">지출
        </div>
        <div id="expense_additional-information" style="display: none">
            <div id="category-info">
                <input type="hidden" id="categoryId-input" class="inputs" name="categoryId">
                <div class="list-title">지출 카테고리</div>
                    <th:block th:each="category : ${allCategories}">
                        <span class="lists" th:text="${category.categoryName}" th:attr="data-id=${category.categoryId}"></span>
                    </th:block>
            </div>
            <div id="payment-info">
                <input type="hidden" id="paymentId-input" name="paymentMethodId">
                <div class="list-title">지출 수단</div>
                    <th:block th:each="paymentList : ${allPayment}">
                        <span class="lists" th:text="${paymentList.paymentMethodName}" th:attr="data-id=${paymentList.paymentMethodId}"></span>
                    </th:block>
            </div>

        </div>
        <div>
            <div>memo</div>
            <textarea id="memo" name="memo" rows="3" cols="30" placeholder="간단히 입력하세요"></textarea>
        </div>

        <button type="submit">등록</button>

    </form>
</div>
</body>
</html>
